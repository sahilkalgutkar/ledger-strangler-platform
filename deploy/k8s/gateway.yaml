apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ledger-strangler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: acrprodledgerstrangler.azurecr.io/gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledger-strangler-config
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ledger-strangler
spec:
  # The only entry point into the cluster - every other service stays
  # ClusterIP-only and is reached exclusively through the Gateway's routing.
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080
