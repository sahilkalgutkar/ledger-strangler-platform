# Placeholder connection strings for local kustomize builds/dry-run validation
# only - matching the docker-compose dev credentials. A real cluster would
# source these from Azure Key Vault via the CSI secrets-store driver instead
# of a plain Kubernetes Secret committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-strangler-secrets
  namespace: ledger-strangler
type: Opaque
stringData:
  ConnectionStrings__Legacy: "Host=postgres-legacy;Port=5432;Database=legacy_monolith;Username=postgres;Password=postgres"
  ConnectionStrings__Notifications: "Host=postgres-notifications;Port=5432;Database=notifications;Username=postgres;Password=postgres"
  RabbitMq__ConnectionString: "amqp://guest:guest@rabbitmq:5672"
