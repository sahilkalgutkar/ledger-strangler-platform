apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: ledger-strangler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      containers:
        - name: notifications-service
          image: acrprodledgerstrangler.azurecr.io/notifications-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Notifications
              valueFrom:
                secretKeyRef:
                  name: ledger-strangler-secrets
                  key: ConnectionStrings__Notifications
            - name: RabbitMq__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: ledger-strangler-secrets
                  key: RabbitMq__ConnectionString
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: ledger-strangler
spec:
  selector:
    app: notifications-service
  ports:
    - port: 8080
      targetPort: 8080
