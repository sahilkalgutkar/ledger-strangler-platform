input {
  beats {
    port => 5044
  }
}

# No filtering needed here - Filebeat's ndjson parser already flattens each
# service's Serilog compact-JSON line (including the "Service" field) to the
# event's top-level fields before it ever reaches Logstash.

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ledger-strangler-platform-%{+YYYY.MM.dd}"
  }
}
